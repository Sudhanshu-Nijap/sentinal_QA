<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="sentinelBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#sentinelBlue)" />

  <!-- Subtle inner border highlight -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="6.5" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

  <!-- Sentinel Shield Emblem -->
  <g transform="translate(4, 4)">
    <path 
      d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" 
      fill="url(#shieldFill)"
      stroke="#ffffff" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Center AI Core Node -->
    <circle cx="12" cy="11" r="2.2" fill="#ffffff" />
  </g>
</svg>